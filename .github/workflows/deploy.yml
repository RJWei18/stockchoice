name: Deploy StockChoice Web to GitHub Pages

on:
  # Daily scheduled run (Mon-Fri at 16:00 Taipei time / 08:00 UTC)
  schedule:
    - cron: '0 8 * * 1-5'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'src/**'
      - 'generate_web_data.py'
      - '.github/workflows/deploy.yml'

# Grant GITHUB_TOKEN permissions required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Generate Web Assets
        continue-on-error: true
        run: |
          python generate_web_data.py || echo "Warning: market data refresh failed, using existing web/data.json"


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
