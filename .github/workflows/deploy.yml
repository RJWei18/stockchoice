name: Deploy StockChoice Web to GitHub Pages and Vercel

on:
  # Daily scheduled run: Mon-Fri 08:25 (Pre-market US sync), 15:30 & 16:15 (Post-market TW sync) Taipei time
  schedule:
    - cron: '25 0 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '15 8 * * 1-5'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'src/**'
      - 'generate_web_data.py'
      - '.github/workflows/deploy.yml'

# Grant GITHUB_TOKEN permissions required for GitHub Pages and data auto-commit
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Generate Web Assets
        continue-on-error: true
        run: |
          python generate_web_data.py || echo "Warning: market data refresh failed, using existing web/data.json"

      - name: Commit Updated Data to Main
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/data.json
          if ! git diff --quiet --cached; then
            git commit -m "chore(data): auto update market data [skip ci]"
            git push origin main
          fi

      - name: Trigger Vercel Deploy Hook
        continue-on-error: true
        run: |
          curl -s -X POST https://api.vercel.com/v1/integrations/deploy/prj_dY7RFCkJAzBUAcub5kj5TY0lObA2/DOQGp6GHfi || echo "Vercel deploy hook trigger failed"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
